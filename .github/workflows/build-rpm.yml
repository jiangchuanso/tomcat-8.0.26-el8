name: Build Tomcat 8.0.26 EL8 RPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tomcat 版本（需与 tomcat8.spec 中的 Version 一致）'
        required: false
        default: '8.0.26'

# 允许工作流创建 Release
permissions:
  contents: write

env:
  TOMCAT_VERSION: "8.0.26"

jobs:
  build:
    name: Build RPM (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注册 QEMU，使 x86_64 的 runner 能运行/模拟 arm64 容器
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Build RPM in Rocky Linux 8 container
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          docker run --rm --platform "$TARGET_PLATFORM" \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            rockylinux:8 \
            /bin/bash -c '
              set -euxo pipefail

              # 安装编译与 RPM 构建工具
              dnf install -y --setopt=install_weak_deps=False \
                rpm-build rpmdevtools tar gzip which file \
                gcc make autoconf libtool openssl-devel apr-devel \
                java-1.8.0-openjdk-headless dnf-plugins-core

              # 初始化 rpmbuild 目录树
              rpmdev-setuptree

              # 准备源代码
              cp tomcat8.spec "$HOME/rpmbuild/SPECS/"
              cp "apache-tomcat-${{ env.TOMCAT_VERSION }}.tar.gz" "$HOME/rpmbuild/SOURCES/"

              # 自动安装 spec 中声明的 BuildRequires
              dnf builddep -y "$HOME/rpmbuild/SPECS/tomcat8.spec"

              # 构建（主包 noarch + 原生子包按目标架构）
              rpmbuild -bb --clean "$HOME/rpmbuild/SPECS/tomcat8.spec"

              # 收集产物
              mkdir -p /workspace/rpms
              find "$HOME/rpmbuild/RPMS" -name "*.rpm" -exec cp -p {} /workspace/rpms/ \;
              ls -l /workspace/rpms
            '

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.arch }}
          path: rpms/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all RPMs
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collate (去重各架构相同的 noarch 包)
        run: |
          mkdir -p dist
          # cp -n 只保留首次出现的文件；noarch 主包在不同架构下内容一致，自动去重
          for d in artifacts/rpms-*; do
            cp -n "$d"/*.rpm dist/ || true
          done
          echo "==== final RPMs ===="
          ls -l dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
          generate_release_notes: true
