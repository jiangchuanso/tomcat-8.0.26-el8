name: Build Tomcat 8.0.26 EL8 RPM

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tomcat 版本（需与 tomcat8.spec 中的 Version 一致）'
        required: false
        default: '8.0.26'

# 允许工作流创建 Release
permissions:
  contents: write

env:
  TOMCAT_VERSION: "8.0.26"

jobs:
  build:
    name: Build RPM (noarch)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 整包为纯 Java noarch，x86_64 / aarch64 产物一致，单次构建即可，
      # 无需 QEMU 模拟 arm64，也无需区分处理器架构
      - name: Build noarch RPM in Rocky Linux 8 container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            rockylinux:8 \
            /bin/bash -c '
              set -euxo pipefail

              # 纯 Java noarch 包：只需 RPM 构建工具，无需 gcc/make/openssl/apr 等原生编译链
              dnf install -y --setopt=install_weak_deps=False \
                rpm-build rpmdevtools tar gzip which file \
                java-1.8.0-openjdk-headless dnf-plugins-core

              # 初始化 rpmbuild 目录树
              rpmdev-setuptree

              # 准备源代码
              cp tomcat8.spec "$HOME/rpmbuild/SPECS/"
              cp "apache-tomcat-${{ env.TOMCAT_VERSION }}.tar.gz" "$HOME/rpmbuild/SOURCES/"
              cp setenv.sh "$HOME/rpmbuild/SOURCES/"

              # 自动安装 spec 中声明的 BuildRequires（本包为空，no-op）
              dnf builddep -y "$HOME/rpmbuild/SPECS/tomcat8.spec"

              # 构建（整包 noarch，单次构建）
              rpmbuild -bb --clean "$HOME/rpmbuild/SPECS/tomcat8.spec"

              # 收集产物
              mkdir -p /workspace/rpms
              find "$HOME/rpmbuild/RPMS" -name "*.rpm" -exec cp -p {} /workspace/rpms/ \;
              ls -l /workspace/rpms
            '

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rpms
          path: rpms/*.rpm
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download RPMs
        uses: actions/download-artifact@v4
        with:
          name: rpms
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
          generate_release_notes: true
